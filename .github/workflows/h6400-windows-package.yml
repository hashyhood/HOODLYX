name: H6400 Windows package

on:
  workflow_dispatch:
  push:
    paths:
      - backend/**
      - frontend/**
      - hashir_remote.spec
      - scripts/**
      - pyproject.toml
      - .github/workflows/h6400-windows-package.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: PyInstaller one-folder
        run: python -m PyInstaller --noconfirm --clean --distpath dist-windows hashir_remote.spec
      - name: Copy license notices
        shell: pwsh
        run: |
          Copy-Item docs\THIRD_PARTY_LICENSES.md dist-windows\HashirSamsungRemote\THIRD_PARTY_LICENSES.md
          Copy-Item docs\licenses\LGPL-3.0.txt dist-windows\HashirSamsungRemote\LGPL-3.0.txt
          Copy-Item docs\licenses\GPL-3.0.txt dist-windows\HashirSamsungRemote\GPL-3.0.txt
      - name: Upload Windows folder
        uses: actions/upload-artifact@v4
        with:
          name: HashirSamsungRemote-windows
          path: dist-windows/HashirSamsungRemote
