[project]
name = "hashir-samsung-remote"
version = "1.0.0"
description = "Local-only Windows host and PWA remote for Samsung UA55H6400 (2014 H-series / Orsay encrypted protocol)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hashir Samsung Remote" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "aiohttp>=3.10.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "samsungtvws[async,encrypted]==3.0.5",
  "keyring>=25.4.0",
  "cryptography>=43.0.0",
  "qrcode>=8.0",
  "pillow>=10.4.0",
  "pystray>=0.19.5",
  "httpx>=0.27.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "pyinstaller>=6.11.0",
]
windows = [
  "pywin32>=308; sys_platform == 'win32'",
]

[project.scripts]
h6400-remote = "app.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tools", "tests"]
extend-exclude = [
  "project",
  "frontend",
  "node_modules",
  "__archive",
  "HoodlyApp",
  "supabase",
  "db",
  "dist",
  "build",
  "release",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "ASYNC240", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
pretty = true
strict = true
packages = ["app"]
mypy_path = "backend"
exclude = ["project/", "frontend/", "HoodlyApp/", "__archive/"]

[[tool.mypy.overrides]]
module = ["keyring", "qrcode", "pystray", "PIL", "win32event", "win32api", "winerror"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["backend", "tools"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "hardware: tests that require a physical Samsung UA55H6400 on the LAN",
]
